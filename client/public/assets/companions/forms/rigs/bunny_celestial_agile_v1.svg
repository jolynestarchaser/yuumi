<svg xmlns="http://www.w3.org/2000/svg" class="companion-soft-pet " style="--pet-walk-cycle:1s" viewBox="0 0 512 512" width="256" height="256" aria-hidden="true" data-species="bunny" data-gait="hop" data-life-stage="grown" data-art-version="pet-form-v1" data-form-id="bunny_celestial_agile_v1" fill="#FFF4DD" stroke="#5B3D45" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><style>.companion-soft-pet { display:block; width:256px; height:256px; overflow:visible; }
.companion-avatar:has(.companion-soft-pet)::after { display:none; }
.companion-avatar:has(.companion-soft-pet) .companion-avatar-motion { animation:none; scale:1; }
.pet-art-root { transform-origin:256px 448px; animation:pet-art-breathe 3.4s ease-in-out infinite; }
.pet-art-eyes { transform-box:fill-box; transform-origin:center; animation:pet-art-blink 6s infinite; }
.pet-art-wings { transform-origin:0 0; animation:pet-art-follow 3.4s ease-in-out infinite; }
.activity-sleeping .pet-art-root { animation:pet-art-rest 4.5s ease-in-out infinite; }
.activity-success .pet-art-root,.reaction-play .pet-art-root { animation:pet-art-hop 1s cubic-bezier(.23,1,.32,1) 2; }
.reaction-feed .pet-art-paw { transform-origin:0 0; animation:pet-art-nibble 1.8s ease-in-out; }
.activity-thinking .pet-art-root { animation:pet-art-think 2.5s ease-in-out infinite; }
.companion-avatar.level-up:has(.companion-soft-pet) .companion-avatar-motion { animation:none; }
.level-up .pet-art-root { animation:pet-art-reveal 1.2s cubic-bezier(.23,1,.32,1); }
.pet-is-walking .pet-art-root { animation:pet-art-stride var(--pet-walk-cycle) ease-in-out infinite; }
.pet-is-walking .pet-art-leg { transform-box:fill-box; transform-origin:center top; animation:pet-art-step var(--pet-walk-cycle) ease-in-out infinite; }
.pet-is-walking .pet-art-leg.near { animation-delay:calc(var(--pet-walk-cycle) / -2); }
.pet-is-walking .pet-art-paw { transform-origin:0 0; animation:pet-art-arm var(--pet-walk-cycle) ease-in-out infinite; }
.pet-is-walking .pet-art-paw.near { animation-delay:calc(var(--pet-walk-cycle) / -2); }
.pet-is-walking .pet-art-tail { transform-origin:0 0; animation:pet-art-follow var(--pet-walk-cycle) ease-in-out infinite; }
.pet-is-walking[data-gait='hop'] .pet-art-root { animation-name:pet-art-travel-hop; }
.pet-is-walking[data-gait='hop'] .pet-art-leg.near { animation-delay:0s; }
.pet-is-walking[data-gait='waddle'] .pet-art-root { animation-name:pet-art-waddle; }
.pet-is-walking[data-gait='float'] .pet-art-root { animation-name:pet-art-float; }
.pet-is-walking[data-gait='float'] .pet-art-leg { animation-name:pet-art-hover-feet; }
.pet-is-walking[data-gait='march'] .pet-art-root { animation-timing-function:linear; }
.pet-is-walking[data-species='robot'] .pet-art-leg { animation-timing-function:steps(4,end); }
.pet-is-walking[data-gait='trot'] .pet-art-root { animation-name:pet-art-trot; }
.motion-paused .companion-soft-pet * { animation:none !important; }
@keyframes pet-art-stride { 0%,50%,100% { transform:translateY(0); } 25%,75% { transform:translateY(-5px); } }
@keyframes pet-art-step { 0%,100% { transform:translate(0,0) rotate(-12deg); } 50% { transform:translate(5px,-6px) rotate(12deg); } }
@keyframes pet-art-arm { 0%,100% { transform:rotate(-13deg); } 50% { transform:rotate(13deg); } }
@keyframes pet-art-travel-hop { 0%,100% { transform:scale(1.04,.96); } 40%,60% { transform:translateY(-22px) scale(.98,1.02); } }
@keyframes pet-art-waddle { 0%,100% { transform:rotate(-4deg); } 50% { transform:rotate(4deg) translateY(-4px); } }
@keyframes pet-art-float { 0%,100% { transform:translateY(-8px) rotate(-2deg); } 50% { transform:translateY(-22px) rotate(2deg); } }
@keyframes pet-art-hover-feet { 0%,100% { transform:rotate(-6deg); } 50% { transform:rotate(6deg); } }
@keyframes pet-art-trot { 0%,50%,100% { transform:translateY(0) rotate(-2deg); } 25%,75% { transform:translateY(-9px) rotate(2deg); } }
@keyframes pet-art-breathe { 0%,100% { transform:scale(1); } 50% { transform:scale(1.015,.99); } }
@keyframes pet-art-rest { 0%,100% { transform:translateY(3px) scale(1,.98); } 50% { transform:translateY(4px) scale(1.01,.97); } }
@keyframes pet-art-blink { 0%,43%,47%,100% { transform:scaleY(1); } 45% { transform:scaleY(.08); } }
@keyframes pet-art-follow { 0%,100% { transform:rotate(0deg); } 50% { transform:rotate(3deg); } }
@keyframes pet-art-hop { 0%,100% { transform:translateY(0); } 15% { transform:scale(1.03,.97); } 42% { transform:translateY(-18px) scale(.98,1.02); } 72% { transform:scale(1.025,.975); } }
@keyframes pet-art-nibble { 0%,100% { transform:rotate(0deg); } 35%,65% { transform:rotate(-20deg); } }
@keyframes pet-art-think { 0%,100% { transform:rotate(0deg); } 50% { transform:rotate(-3deg); } }
@keyframes pet-art-reveal { 0%,100% { transform:scale(1); opacity:1; } 25% { transform:scale(.98,1.02); } 55% { transform:scale(1.025,.975); opacity:.8; } }
@media (prefers-reduced-motion:reduce) { .companion-soft-pet * { animation:none !important; } }
