 rx="18" ry="9"></ellipse></g><path data-layer="highlight" d="M170 224Q176 191 198 184" fill="none" stroke="#FFF4DD" stroke-width="12" opacity=".8"></path><g data-layer="wardrobeHead" fill="#FFBD77" stroke-width="7"></g><g data-layer="formNativeSignature" fill="#FFBD77" stroke-width="6"></g></g></g></g></svg>