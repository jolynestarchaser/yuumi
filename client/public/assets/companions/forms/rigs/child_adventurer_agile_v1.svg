le><circle cx="370" cy="258" r="21"></circle></g></g><path data-layer="head" d="M166 232Q164 167 256 147Q348 167 346 232L354 277Q345 331 303 342H209Q167 331 158 277Z"></path><path data-layer="storybookHair" d="M146 226C137 169 190 140 257 149C319 142 367 174 370 220Q330 228 311 184Q286 209 268 187Q218 228 192 196Q175 222 146 226Z" fill="#FFBD77"></path><g data-layer="forelimbs" fill="#F7D8BE"><g transform="translate(162 345) scale(1 1)" data-layer="forelimbFar"><g class="pet-art-paw far" style="transform-origin:0px 0px"><path d="M0 0C-25-2-22 21-33 26C-45 33-37 47-23 44C-22 60-3 65 4 49C23 58 35 42 22 29C29 13 16 0 0 0Z"></path><path d="M-8 29L-7 37M6 28L8 35" fill="none" stroke-width="6"></path></g></g><g transform="translate(350 345) scale(-1 1)" data-layer="forelimbNear"><g class="pet-art-paw near" style="transform-origin:0px 0px"><path d="M0 0C-25-2-22 21-33 26C-45 33-37 47-23 44C-22 60-3 65 4 49C23 58 35 42 22 29C29 13 16 0 0 0Z"></path><path d="M-8 29L-7 37M6 28L8 35" fill="none" stroke-width="6"></path></g></g></g><g data-layer="face" stroke="#41334D" fill="#41334D"><g class="pet-art-eyes"><g><ellipse cx="211" cy="264" rx="10" ry="15" stroke="none"></ellipse><circle cx="208" cy="258" r="3.5" fill="#FFF4DD" stroke="none"></circle></g><g><ellipse cx="305" cy="264" rx="10" ry="15" stroke="none"></ellipse><circle cx="302" cy="258" r="3.5" fill="#FFF4DD" stroke="none"></circle></g></g><path d="M245 293Q259 306 274 293" fill="none" stroke-width="7"></path></g><g data-layer="cheeks" fill="#F6A4B6" stroke="none" opacity=".8"><ellipse cx="187" cy="291" rx="18" ry="9"></ellipse><ellipse cx="330" cy="291" rx="18" ry="9"></ellipse></g><path data-layer="highlight" d="M170 224Q176 191 198 184" fill="none" stroke="#FFF4DD" stroke-width="12" opacity=".8"></path><g data-layer="wardrobeHead" fill="#FFBD77" stroke-width="7"></g><g data-layer="formNativeSignature" fill="#FFBD77" stroke-width="6"><path d="M166 216L177 185L205 180L215 166L258 183L284 164L315 183L340 177L347 216Q28