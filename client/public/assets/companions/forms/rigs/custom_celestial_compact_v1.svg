/g><g data-layer="wardrobeBody" fill="#C5B6E8" stroke-width="7"></g><g data-layer="ears" transform="translate(-12.30769230769232 0) scale(1.0480769230769231 1)" fill="#C5B6E8"><g data-layer="cloudEars"><path d="M165 206C130 215 117 191 126 173C105 152 125 128 146 137C154 103 191 117 190 147L203 173Z"></path><path d="M316 176L324 145C326 110 360 119 363 145C391 134 402 166 382 181C390 204 366 217 342 204Z"></path></g></g><path data-layer="head" d="M146 238Q125 187 173 166Q193 137 225 153Q256 131 287 153Q319 137 339 166Q387 187 366 238L382 276Q372 323 330 327Q291 355 256 339Q221 355 182 327Q140 323 130 276Z"></path><g data-layer="forelimbs" fill="#C5B6E8"><g transform="translate(147 348) scale(1 1)" data-layer="forelimbFar"><g class="pet-art-paw far" style="transform-origin:0px 0px"><path d="M0 0C-25-2-22 21-33 26C-45 33-37 47-23 44C-22 60-3 65 4 49C23 58 35 42 22 29C29 13 16 0 0 0Z"></path><path d="M-8 29L-7 37M6 28L8 35" fill="none" stroke-width="6"></path></g></g><g transform="translate(365 348) scale(-1 1)" data-layer="forelimbNear"><g class="pet-art-paw near" style="transform-origin:0px 0px"><path d="M0 0C-25-2-22 21-33 26C-45 33-37 47-23 44C-22 60-3 65 4 49C23 58 35 42 22 29C29 13 16 0 0 0Z"></path><path d="M-8 29L-7 37M6 28L8 35" fill="none" stroke-width="6"></path></g></g></g><g data-layer="face" stroke="#41334D" fill="#41334D"><g class="pet-art-eyes"><g><ellipse cx="211" cy="264" rx="10" ry="15" stroke="none"></ellipse><circle cx="208" cy="258" r="3.5" fill="#FFF4DD" stroke="none"></circle></g><g><ellipse cx="305" cy="264" rx="10" ry="15" stroke="none"></ellipse><circle cx="302" cy="258" r="3.5" fill="#FFF4DD" stroke="none"></circle></g></g><path d="M245 293Q259 306 274 293" fill="none" stroke-width="7"></path></g><g data-layer="cheeks" fill="#F6A4B6" stroke="none" opacity=".8"><ellipse cx="187" cy="291" rx="18" ry="9"></ellipse><ellipse cx="330" cy="291" rx="18" ry="9"></ellipse></g><path data-layer="highlight" d="M170 224Q176 191 198 184" fill="none" stroke