  <use href="#face-idle" x="85" y="190" width="410" height="470"/>
  <path d="M481 210 Q529 200 558 219" fill="none" stroke="#CDB9D7" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="505" y="195" fill="#7C6787" font-family="Arial, sans-serif" font-size="14">folded petal ear</text>
  <text x="61" y="663" fill="#7C6787" font-family="Arial, sans-serif" font-size="14">large head · tiny paws · gentle asymmetry</text>
  <text x="590" y="82" fill="#57465F" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">EXPRESSIONS</text>
  <g fill="#FFFFFF" stroke="#E9DDEC" stroke-width="2">
    <rect x="580" y="102" width="262" height="245" rx="25"/><rect x="862" y="102" width="262" height="245" rx="25"/>
    <rect x="580" y="363" width="262" height="245" rx="25"/><rect x="862" y="363" width="262" height="245" rx="25"/>
  </g>
  <use href="#mimi-body" x="626" y="112" width="170" height="195"/><use href="#face-idle" x="626" y="112" width="170" height="195"/>
  <use href="#mimi-body" x="908" y="112" width="170" height="195"/><use href="#face-happy" x="908" y="112" width="170" height="195"/>
  <use href="#mimi-body" x="626" y="373" width="170" height="195"/><use href="#face-sleep" x="626" y="373" width="170" height="195"/>
  <use href="#mimi-body" x="908" y="373" width="170" height="195"/><use href="#face-curious" x="908" y="373" width="170" height="195"/>
  <g fill="#55465E" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <text x="711" y="329">Idle</text><text x="993" y="329">Happy</text><text x="711" y="590">Sleepy</text><text x="993" y="590">Curious</text>
  </g>
  <text x="590" y="667" fill="#766880" font-family="Arial, sans-serif" font-size="15">Soft vinyl volume · simple facial swaps · animation-ready parts</text>
  <g transform="translate(590 693)"><circle cx="12" cy="12" r="12" fill="#DCC6F2"/><circle cx="54" cy="12" r="12" fill="#FFF0DF"/><circle cx="96" cy="12" r="12" fill="#EFA9B9"/><circle cx="138" cy="12" r="12" fill="#A9CBAA"/><circle cx="180" cy="12" r="12" fill="#41334D"/></g>
</svg>
