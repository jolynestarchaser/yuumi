<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Mimi soft vinyl companion style sheet</title>
  <desc id="description">A large lavender virtual pet with petal ears, tiny paws, warm cream belly, blush cheeks, and four small expression examples.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#FFF9F2"/><stop offset="1" stop-color="#F7F0FC"/></linearGradient>
    <radialGradient id="vinyl" cx="33%" cy="23%" r="83%"><stop stop-color="#F5EAFB"/><stop offset=".42" stop-color="#DCC6F2"/><stop offset="1" stop-color="#B69ACD"/></radialGradient>
    <linearGradient id="ear" x2=".8" y2="1"><stop stop-color="#EED9F7"/><stop offset="1" stop-color="#BEA2D4"/></linearGradient>
    <linearGradient id="belly" x2=".8" y2="1"><stop stop-color="#FFF9EC"/><stop offset="1" stop-color="#F4DCCB"/></linearGradient>
    <filter id="shadow" x="-40%" y="-60%" width="180%" height="240%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="blush"><feGaussianBlur stdDeviation="2.3"/></filter>
