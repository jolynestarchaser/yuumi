  <rect width="1200" height="760" rx="28" fill="url(#background)"/>
  <text x="66" y="72" fill="#57465F" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3">CHARACTER STYLE DIRECTION / SOFT MODE</text>
  <text x="66" y="136" fill="#41334D" font-family="Georgia, serif" font-size="60" font-weight="700">Meet Mimi</text>
  <text x="68" y="170" fill="#766880" font-family="Arial, sans-serif" font-size="17">A little friend with the warmth of a well-loved toy.</text>
  <ellipse cx="281" cy="600" rx="177" ry="30" fill="#DCC6F2" opacity=".24"/>
