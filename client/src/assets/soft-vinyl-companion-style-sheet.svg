      <ellipse cx="190" cy="187" rx="19" ry="28" transform="rotate(-24 190 187)" fill="#BDA0D2"/>
      <path d="M120 68 C64 68 31 101 32 153 C32 200 64 236 121 237 C178 239 210 204 210 153 C210 102 177 67 120 68 Z" fill="url(#vinyl)" stroke="#B69ACD" stroke-width="2.5"/>
      <path d="M67 119 C78 91 101 83 117 84" fill="none" stroke="#FFF8FF" stroke-width="8" stroke-linecap="round" opacity=".34"/>
      <path d="M81 199 C84 184 96 174 120 172 C144 174 157 184 160 199 C155 218 142 226 121 227 C98 226 86 219 81 199 Z" fill="url(#belly)" opacity=".9"/>
