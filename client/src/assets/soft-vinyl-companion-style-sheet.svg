      <ellipse cx="158" cy="226" rx="28" ry="15" transform="rotate(13 158 226)" fill="#BEA0D6" stroke="#A98CBE" stroke-width="1.5"/>
      <ellipse cx="68" cy="159" rx="12" ry="7" fill="#EFA9B9" opacity=".68" filter="url(#blush)"/>
      <ellipse cx="175" cy="159" rx="12" ry="7" fill="#EFA9B9" opacity=".68" filter="url(#blush)"/>
      <path d="M115 81 C113 73 107 70 103 69 M117 79 C120 71 126 67 132 68" fill="none" stroke="#A9CBAA" stroke-width="4" stroke-linecap="round"/>
      <path d="M105 69 C101 61 92 61 91 69 C95 74 101 73 105 69 Z M125 68 C132 59 142 61 141 68 C136 73 131 73 125 68 Z" fill="#A9CBAA"/>
    </symbol>
    <symbol id="face-idle" viewBox="0 0 240 275">
      <ellipse cx="93" cy="141" rx="7" ry="10" fill="#41334D"/><ellipse cx="150" cy="141" rx="7" ry="10" fill="#41334D"/>
      <ellipse cx="91" cy="137" rx="2.2" ry="3.1" fill="white"/><ellipse cx="148" cy="137" rx="2.2" ry="3.1" fill="white"/>
      <path d="M115 163 Q121 169 127 163" fill="none" stroke="#674A68" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="face-happy" viewBox="0 0 240 275">
      <path d="M84 144 Q93 133 102 144 M141 144 Q150 133 159 144" fill="none" stroke="#41334D" stroke-width="4" stroke-linecap="round"/>
      <path d="M114 160 Q121 178 129 160 Z" fill="#8D567B" stroke="#674A68" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="face-sleep" viewBox="0 0 240 275">
      <path d="M84 140 Q93 148 102 140 M141 140 Q150 148 159 140" fill="none" stroke="#41334D" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="122" cy="164" rx="2.8" ry="3.5" fill="#674A68"/>
