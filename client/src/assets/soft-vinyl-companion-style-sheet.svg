      <path d="M62 86 C49 64 46 35 55 26 C67 27 85 57 85 84 Z" fill="#EFA9B9" opacity=".54"/>
      <path d="M174 79 C187 48 204 35 207 40 C207 55 192 77 177 86 Z" fill="#EFA9B9" opacity=".48"/>
